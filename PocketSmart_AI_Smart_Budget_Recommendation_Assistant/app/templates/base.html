<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PocketSmart AI{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
    <div class="container">
        <div class="brand">💰 PocketSmart AI</div>
        <p>Your Smart Budget & Recommendation Assistant</p>
    </div>
</header>

<main class="container">
    {% block content %}{% endblock %}
</main>

<footer>
    <div class="container">
        PocketSmart provides general budgeting guidance, not financial advice.
    </div>
</footer>
</body>
</html>
